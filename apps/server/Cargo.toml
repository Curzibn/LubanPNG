[package]
name = "lubanpng"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TinyPNG-style image compression web service"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "limit", "trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
image = "0.25"
imagequant = "4"
oxipng = "10"
mozjpeg = "0.10"
img-parts = "0.4"
image-compare = "0.5"
async-trait = "0.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
object_store = { version = "0.14.1", features = ["aws"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
rand = "0.10.2"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
bytes = "1.12.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
