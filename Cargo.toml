[package]
name = "lubanpng"
version = "0.1.0"
edition = "2021"
description = "TinyPNG-style image compression web service"
license = "MIT"
repository = "https://github.com/Curzibn/LubanPNG"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
imagequant = "4"
oxipng = "9"
mozjpeg = "0.10"
img-parts = "0.3"
image-compare = "0.4"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
