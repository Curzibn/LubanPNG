apiVersion: apps/v1
kind: Deployment
metadata:
  name: lubanpng-agent
  namespace: lubanpng
  labels:
    app: lubanpng-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lubanpng-agent
  template:
    metadata:
      labels:
        app: lubanpng-agent
    spec:
      containers:
        - name: gateway
          image: registry.opus.wizthink.cn:5000/lubanpng/agent-gateway@sha256:20cbee7fab3179381f10d6f66f3151473b76e2ba9b9cb38e1cc26d6b405e9bc5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_GATEWAY_PORT
              value: "8080"
            - name: AGENT_GATEWAY_UPSTREAM_URL
              value: http://lubanpng:80
            - name: AGENT_GATEWAY_PUBLIC_BASE_URL
              value: https://lubanpng.wizthink.cn
            - name: AGENT_GATEWAY_SESSION_QUOTA
              value: "5"
            - name: AGENT_GATEWAY_SESSION_UPSCALE_QUOTA
              value: "1"
            - name: AGENT_GATEWAY_ANONYMOUS_DAILY_LIMIT
              value: "10000"
            - name: AGENT_GATEWAY_STATUS_WAIT_MAX
              value: "30"
            - name: AGENT_GATEWAY_UPSTREAM_TIMEOUT_MS
              value: "120000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lubanpng-agent
  namespace: lubanpng
spec:
  selector:
    app: lubanpng-agent
  ports:
    - name: http
      port: 80
      targetPort: http
